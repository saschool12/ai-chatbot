version: '3.8'

services:
  ai-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: java-ai-chatbot
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - AI_DEFAULT_PROVIDER=builtin
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
